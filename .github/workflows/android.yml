name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'core/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'core/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm run typecheck

      # Each build gets a higher versionCode so it installs over the previous one.
      - name: Set version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          jq --arg v "$VERSION" --argjson c ${{ github.run_number }} '.expo.version = $v | .expo.android.versionCode = $c' app.json > app.tmp && mv app.tmp app.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npx expo prebuild --platform android --no-install

      # Release build signed with the template's standard debug key: fine for installing directly,
      # and the same key every time, so updates install over the old version without losing data.
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk chess-coach.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chess-coach-${{ env.VERSION }}
          path: mobile/chess-coach.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-v$VERSION" chess-coach.apk \
            --title "Chess Coach $VERSION (Android)" \
            --notes "Install on Android: download chess-coach.apk on your phone and open it. You may need to allow installs from your browser. Built from ${GITHUB_SHA::7}." \
            --latest
